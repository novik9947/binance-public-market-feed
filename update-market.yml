name: Publish Binance Public Candle Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: public-binance-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline calculations check
        run: python fetch_market.py --self-test
      - name: Fetch closed Binance Spot candles
        run: python -u fetch_market.py
      - name: Publish JSON files to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary.json market/*.json
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Refresh public Binance market feed'
            git push
          fi
